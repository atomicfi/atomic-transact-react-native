name: Build & Upload Appium Test App

on:
  workflow_call:
    inputs:
      platform:
        description: "android or ios"
        required: true
        type: string
      app_name:
        description: "Name to give the upload in Device Farm"
        required: true
        type: string
      cleanup_previous:
        description: "Delete other uploads in the Device Farm project that share this app_name"
        required: false
        default: false
        type: boolean
    outputs:
      upload_arn:
        description: "ARN of the uploaded app in AWS Device Farm"
        value: ${{ jobs.upload.outputs.upload_arn }}
    secrets:
      CONFORMANCE_REPO_PULL_KEY:
        required: true
      EXPO_TOKEN:
        required: true
      EXPO_APPLE_ID:
        required: false
      EXPO_APPLE_PASSWORD:
        required: false
      EXPO_TEAM_ID:
        required: false

jobs:
  build:
    name: Build AppiumTestEnvironment (${{ inputs.platform }})
    # Device Farm runs on real devices, so iOS needs a signed .ipa rather than the simulator build
    # the local `appium` profile produces. That build has to happen on macOS.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
      EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗 Select Xcode
        if: inputs.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: 📦 Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: 📦 Setup yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 📦 Setup Gradle cache
        if: inputs.platform == 'android'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Setup CocoaPods cache
        if: inputs.platform == 'ios'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: 📱 Build Appium test app
        working-directory: ./appium-test-environment
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          if [ "$PLATFORM" = "ios" ]; then
            yarn dlx eas-cli@latest build --platform ios --profile appium-device \
              --local --non-interactive --output="./$APP_NAME"
          else
            yarn dlx eas-cli@latest build --platform android --profile appium \
              --local --non-interactive --output="./$APP_NAME"
          fi
        env:
          PLATFORM: ${{ inputs.platform }}
          APP_NAME: ${{ inputs.app_name }}
          # CocoaPods dies in Ruby's unicode normalization without a UTF-8 locale.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: 📦 Upload build artifact to GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.app_name }}
          path: ./appium-test-environment/${{ inputs.app_name }}
          retention-days: 7

  upload:
    name: Upload to Device Farm (${{ inputs.platform }})
    needs: build
    uses: atomicfi/mobile-conformance-tests/.github/workflows/upload_aws_test_app.yml@main
    with:
      artifact_name: ${{ inputs.app_name }}
      app_type: ${{ inputs.platform == 'ios' && 'IOS_APP' || 'ANDROID_APP' }}
      app_name: ${{ inputs.app_name }}
      cleanup_previous: ${{ inputs.cleanup_previous }}
      ref: main
    secrets:
      GITHUB_DEPLOY_KEY: ${{ secrets.CONFORMANCE_REPO_PULL_KEY }}
