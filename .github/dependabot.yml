version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      # Poll daily so new Expo-family releases trigger alignment promptly. The
      # cooldown below still holds routine packages for seven days.
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
      # Let Expo-family releases trigger the compatibility workflow immediately
      # instead of waiting behind the general cooldown.
      exclude:
        - '@expo/*'
        - '@types/react'
        - 'expo'
        - 'expo-*'
        - 'eslint-config-expo'
        - 'react-native-safe-area-context'
        - 'react-native-screens'
        - 'typescript'
    groups:
      # Expo controls these versions as a compatibility cohort. Dependabot may
      # propose patches, but CI only accepts the group after Expo's fixer agrees.
      expo-compatible-patches:
        applies-to: version-updates
        patterns:
          - '@expo/*'
          - '@types/react'
          - 'expo'
          - 'expo-*'
          - 'eslint-config-expo'
          - 'react-native-safe-area-context'
          - 'react-native-screens'
          - 'typescript'
        update-types:
          - 'patch'
      # A new Expo SDK is proposed as one coordinated PR. The alignment workflow
      # lets the new Expo CLI choose matching React Native and native-module
      # versions, so the dependency migration itself does not require hand edits.
      expo-sdk:
        applies-to: version-updates
        patterns:
          - '@expo/*'
          - 'expo'
          - 'expo-*'
          - 'eslint-config-expo'
        update-types:
          - 'minor'
          - 'major'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - '@expo/*'
          - '@react-native/*'
          - '@react-native-async-storage/async-storage'
          - '@types/react'
          - 'expo'
          - 'expo-*'
          - 'eslint-config-expo'
          - 'react'
          - 'react-native'
          - 'react-native-safe-area-context'
          - 'react-native-screens'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
        exclude-patterns:
          - '@expo/*'
          - '@react-native/*'
          - '@react-native-async-storage/async-storage'
          - '@types/react'
          - 'expo'
          - 'expo-*'
          - 'eslint-config-expo'
          - 'react'
          - 'react-native'
          - 'react-native-safe-area-context'
          - 'react-native-screens'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
    # Security updates stay independent. Running Expo's fixer on a security PR
    # could revert the remediation to an older SDK-recommended version.
    ignore:
      # eslint 10 isn't supported by @typescript-eslint/parser v8 yet
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # @babel/core 8.x breaks @react-native/babel-preset's ^7.4.0 peer
      # requirement — RN's preset must move first.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      # The root updater sees every Yarn workspace, so Expo compatibility rules
      # live here. Exact React/React Native pins and peripheral minor/major bumps
      # move only when Expo's fixer selects them. Security updates are unaffected
      # by these version-update filters.
      - dependency-name: '@react-native/*'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@react-native-async-storage/async-storage'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'react-native-safe-area-context'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'react-native-screens'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'

  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      # GitHub's supported cooldown range starts at one day. Excluding the only
      # allowed dependency preserves immediate native SDK update checks.
      exclude:
        - 'financial.atomic:transact'
    allow:
      - dependency-name: 'financial.atomic:transact'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
